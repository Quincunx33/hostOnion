name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-shell:
    name: Python ${{ matrix.python-version }} and shell checks
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q hostonion.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: bash -n install.sh termux/setup.sh tests/tor_php_smoke.sh

  php-lint:
    name: PHP syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint demo PHP files
        run: find demo_site -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  tor-php-demo:
    name: Tor + PHP onion-service smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Tor and PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y tor php-cli curl
      - name: Start demo PHP site and Tor v3 onion service
        run: bash tests/tor_php_smoke.sh
